<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0c2018">
  <meta name="description" content="みんなのブロックワールドはMinecraft統合版のマルチプレイサーバーです。">
  <title>みんなのブロックワールド｜Minecraft統合版サーバー</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css?v=5">
  <script type="module" src="./connection.mjs?v=5"></script>
</head>
<body>
  <main class="page">
    <header class="brand"><span aria-hidden="true"></span>Minecraft 統合版</header>
    <div class="hero">
      <section class="content" aria-labelledby="title">
        <p class="edition">マルチプレイサーバー</p>
        <h1 id="title">みんなの<br>ブロックワールド</h1>
        <a id="play" class="play" role="link" aria-disabled="true" aria-describedby="status">
          <span>Minecraftで参加</span><span class="arrow" aria-hidden="true">→</span>
        </a>
        <p id="status" class="status" role="status">接続先を確認しています…</p>
        <button id="retry" class="retry" type="button" hidden>接続先を更新</button>
        <details>
          <summary>はじめての参加・接続のヘルプ</summary>
          <div class="help">
            <p>端末にMinecraft統合版を入れて、Microsoftアカウントでサインインしてください。「Minecraftで参加」を押すとアプリが開きます。</p>
            <p>直接開けないときは、サーバーを追加してMinecraftから参加できます。接続先は変わることがあるので、次に遊ぶときもこのページを開いてください。</p>
            <a id="register" class="register" role="link" aria-disabled="true">Minecraftにサーバーを追加</a>
            <div class="address">
              <strong>サーバーアドレス</strong>
              <code id="address">確認中…</code>
              <button id="copy" type="button" disabled>コピー</button>
            </div>
            <p>ポート <strong>443</strong></p>
          </div>
        </details>
      </section>
      <div class="world" aria-hidden="true"><img src="./woodland.webp" width="1280" height="960" alt=""></div>
    </div>
  </main>
</body>
</html>
