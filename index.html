<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d9f6ff">
  <meta name="description" content="AIの世界であそぼう！">
  <title>AIの世界であそぼう！</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./connection.mjs"></script>
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="title">
      <div class="sky" aria-hidden="true">
        <span class="cloud cloud-one"></span><span class="cloud cloud-two"></span>
        <svg class="world" viewBox="0 0 360 224" role="img" aria-label="木や草がある、カラフルなブロックの世界">
          <rect x="0" y="0" width="360" height="224" rx="20" fill="#9be4ff"/>
          <circle cx="288" cy="47" r="25" fill="#ffe37a"/>
          <path d="M0 158 78 94l51 47 65-67 85 81 39-35 42 29v75H0Z" fill="#78c8a1"/>
          <path d="m0 180 75-58 45 37 66-52 84 60 43-31 47 32v56H0Z" fill="#4da66d"/>
          <rect x="0" y="183" width="360" height="41" fill="#6fca61"/>
          <rect x="0" y="202" width="360" height="22" fill="#a96943"/>
          <rect x="53" y="145" width="45" height="38" fill="#8b593a"/>
          <rect x="43" y="125" width="66" height="27" rx="3" fill="#2e9d55"/>
          <rect x="50" y="108" width="53" height="25" rx="3" fill="#39b75f"/>
          <rect x="59" y="92" width="35" height="22" rx="3" fill="#4ccc68"/>
          <rect x="74" y="104" width="8" height="8" fill="#ffed91"/>
          <rect x="236" y="155" width="38" height="28" rx="4" fill="#f08a58"/>
          <rect x="240" y="143" width="29" height="18" rx="4" fill="#ffba75"/>
          <rect x="244" y="157" width="8" height="8" fill="#593d39"/>
          <rect x="258" y="157" width="8" height="8" fill="#593d39"/>
          <path d="M243 170q11 9 22 0" fill="none" stroke="#593d39" stroke-width="3" stroke-linecap="round"/>
          <rect x="132" y="166" width="24" height="17" fill="#f4d56c"/>
          <rect x="162" y="150" width="18" height="33" fill="#6eb9e9"/>
          <path d="M122 183h18m42 0h16" stroke="#f7f1d6" stroke-width="5" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="content">
        <p class="eyebrow"><span aria-hidden="true">✦</span> みんなのブロックワールド</p>
        <h1 id="title">AIの世界へ<br><span>ようこそ！</span></h1>
        <p class="intro">ブロックの世界を、いっしょに探検しよう。</p>

        <button id="play" class="play" type="button" disabled>
          <span class="play-mark" aria-hidden="true">▶</span><span id="play-label">世界をさがしているよ…</span>
        </button>
        <p id="status" class="status" role="status" aria-live="polite">接続先を見つけているよ…</p>

        <button id="retry" class="retry" type="button" hidden>もう一度さがす</button>

        <details class="details">
          <summary>はじめてのとき・うまくいかないとき</summary>
          <div class="details-body">
            <p>いつもこのページの「あそぶ！」から入るのがいちばんかんたん。世界の住所は変わることがあるよ。</p>
            <p>「世界を登録する」を押すと、Minecraftにこの世界を登録できるよ。</p>
            <a id="register" class="register" href="#" aria-disabled="true">Minecraftに世界を登録する</a>
            <div class="address-row">
              <span class="address-label">世界の住所</span>
              <code id="address">見つかるとここに表示されるよ</code>
              <button id="copy" class="copy" type="button" disabled>コピー</button>
            </div>
            <p class="port-note">ポートは <strong>443</strong> だよ。コピーできないときは、住所を長押しして選んでね。</p>
          </div>
        </details>
      </div>
    </section>
    <footer>たのしくあそぼう！ <span aria-hidden="true">☀</span></footer>
  </main>
</body>
</html>
